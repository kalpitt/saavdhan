# JVM settings for the build. -Xmx2048m gives the build robot 2 GB of memory.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the modern AndroidX support libraries (required for Compose).
android.useAndroidX=true

# Each module gets its own R (resource) class — faster, cleaner builds.
android.nonTransitiveRClass=true

# Kotlin official code style.
kotlin.code.style=official
