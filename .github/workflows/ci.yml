name: CI

# Runs the detection-engine tests, Android Lint, and a debug build on every push and PR.
# This is our guard against "works on my machine" regressions.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Drift check (docs consistency)
        run: bash context/scripts/drift_check.sh

      - name: Unit tests (the detection engine)
        run: ./gradlew testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Verify the offline guarantee (no INTERNET permission in debug or release)
        run: |
          set -e
          # Fail loudly if the path structure changed (don't silently pass on missing path)
          if [ ! -d "app/build/intermediates/merged_manifest"* 2>/dev/null ] && ! find app/build/intermediates -type d -name "merged_manifest*" -quit 2>/dev/null | grep -q .; then
            echo "::error::Merged manifest path not found — cannot verify offline guarantee. Build output may have changed."
            exit 1
          fi
          # Now check that INTERNET is not present anywhere in the manifests
          if grep -rq "android.permission.INTERNET" app/build/intermediates/merged_manifest* 2>/dev/null; then
            echo "::error::INTERNET permission found in the merged manifest — the offline rule is broken."
            exit 1
          fi
          echo "✅ OK: no INTERNET permission in debug or release merged manifests."
